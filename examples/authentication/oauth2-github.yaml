# OAuth2 authentication with GitHub + connect JWT headers
#
# Before using:
#   1. Register a GitHub OAuth App at https://github.com/settings/developers
#   2. Set the callback URL to: http://oauth2-github.example.com/oauth2/callback
#      (or https:// if using TLS)
#   3. Copy your Client ID and Client Secret below.
#
# Connect headers:
#   When connect.enabled is true, ingress injects two headers into the upstream
#   request after successful authentication:
#     X-Connect-Token:     JWT containing the authenticated user's info
#     X-Connect-Timestamp: Unix millisecond timestamp
#   The upstream service can decode the JWT using the shared jwt.secret.
#
#   If connect is not needed (auth-only mode), omit the connect block entirely.

port: 8080

# Shared session key for OAuth2/OIDC cookies.
#   Set the SAME value on every ingress replica so the CSRF state + post-login redirect
#   survive a load-balanced callback. When omitted, a per-process random key is used,
#   which breaks OAuth2 in multi-replica deployments. SECRET_KEY env overrides this.
#   Generate one with `openssl rand -hex 32`.
#   Because the session lives entirely in the cookie, sticky sessions are NOT required.
# secret_key: "a-long-random-shared-secret"

rules:
  - host: oauth2-github.example.com
    backend:
      service:
        mode: external
        protocol: https
        name: httpbin.zcorky.com
        port: 443
        auth:
          # enabled: true  # optional, defaults to true when type is set; set to false to temporarily disable auth
          type: oauth2
          oauth2:
            provider: github
            client_id: "your-github-client-id"
            client_secret: "your-github-client-secret"
            scopes:
              - "user:email"
            # Recommended behind a TLS-terminating LB so the IdP always sees one https callback:
            # redirect_url: "https://oauth2-github.example.com/oauth2/callback"

            # Optional: connect JWT headers for upstream user identification.
            connect:
              enabled: true
              jwt:
                secret: "your-shared-jwt-secret"
                # algorithm: hs256       # optional, default hs256
                # expires_in: "5m"       # optional, default 5m
